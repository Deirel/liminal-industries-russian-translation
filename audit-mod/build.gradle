import groovy.json.JsonSlurper
import groovy.json.JsonOutput

plugins {
    id 'net.minecraftforge.gradle' version '[6.0.36,6.2)'
}

def selectedTranslationVersion = providers.gradleProperty('translationVersion')
    .getOrElse(translation_version)
if (!(selectedTranslationVersion ==~ /[a-zA-Z0-9._-]+/)) {
    throw new GradleException("Invalid translationVersion: ${selectedTranslationVersion}")
}
def translationConfigFile = layout.projectDirectory.file(
    "../translation-versions/${selectedTranslationVersion}/build-config.json"
).asFile
def translationSourcesFile = layout.projectDirectory.file(
    "../translation-versions/${selectedTranslationVersion}/sources.json"
).asFile
def translationManifestFile = layout.projectDirectory.file(
    "../translation-versions/${selectedTranslationVersion}/manifest.json"
).asFile
def translationCatalogFile = layout.projectDirectory.file(
    "../translation-catalog/catalog.json"
).asFile
def runtimeAuditOverridesFile = layout.projectDirectory.file(
    "../translation-versions/${selectedTranslationVersion}/runtime-audit-overrides.json"
).asFile
def translationResourcePack = layout.projectDirectory.dir(
    "../translation-versions/${selectedTranslationVersion}/payload/resourcepack"
)
def compatibilityResourcePack = layout.projectDirectory.dir(
    "../translation-versions/${selectedTranslationVersion}/compatibility-resourcepack"
)
def compatibilityEnglishResources = fileTree(compatibilityResourcePack.asFile) {
    include 'assets/*/lang/en_us.json'
}
if (!translationConfigFile.isFile()) {
    throw new GradleException(
        "Unknown translationVersion '${selectedTranslationVersion}': "
            + "${translationConfigFile} does not exist"
    )
}
def translationConfig = new JsonSlurper().parse(translationConfigFile)
if (translationConfig.schema != 1 || translationConfig.version != selectedTranslationVersion) {
    throw new GradleException("Invalid translation build config: ${translationConfigFile}")
}

version = translationConfig.version
group = mod_group_id

base {
    archivesName = 'liminal-industries-russian-translation-audit'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {
    mappings channel: 'official', version: minecraft_version

    runs {
        client {
            workingDirectory project.file('run-layout-audit')
            property 'forge.logging.console.level', 'info'
            property 'liminal.layoutAudit.auto', 'true'
            property 'liminal.layoutAudit.exitWhenDone', 'true'
            args '--quickPlaySingleplayer', 'Liminal Layout Audit'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
    }
}

repositories {
    maven {
        name = 'Mantle'
        url = 'https://dvs1.progwml6.com/files/maven'
    }
    maven {
        name = 'Jared'
        url = 'https://maven.blamejared.com/'
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    compileOnly fg.deobf("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}")
    compileOnly fg.deobf("mezz.jei:jei-${minecraft_version}-forge-api:${jei_version}")
    compileOnly fg.deobf(
        "vazkii.patchouli:Patchouli:${minecraft_version}-${translationConfig.patchouli_version}-FORGE"
    )
    compileOnly fg.deobf(
        "slimeknights.mantle:Mantle:${minecraft_version}-${translationConfig.mantle_version}"
    )
    runtimeOnly fg.deobf("mezz.jei:jei-${minecraft_version}-forge:${jei_version}")
    runtimeOnly fg.deobf(
        "vazkii.patchouli:Patchouli:${minecraft_version}-${translationConfig.patchouli_version}-FORGE"
    )
    runtimeOnly fg.deobf(
        "slimeknights.mantle:Mantle:${minecraft_version}-${translationConfig.mantle_version}"
    )

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation fg.deobf(
        "slimeknights.mantle:Mantle:${minecraft_version}-${translationConfig.mantle_version}"
    )
}

tasks.named('processResources', ProcessResources).configure {
    def properties = [
        minecraft_version: minecraft_version,
        forge_version: forge_version,
        jei_version: jei_version,
        patchouli_version: translationConfig.patchouli_version,
        mantle_version: translationConfig.mantle_version,
        tconstruct_version: translationConfig.tconstruct_version,
        mod_id: mod_id,
        mod_version: translationConfig.version
    ]
    inputs.properties properties
    inputs.file translationSourcesFile
    dependsOn 'generateTranslationAuditIndex', 'generateBookTranslationIndex'

    from(translationSourcesFile) {
        rename { 'translation-sources.json' }
    }
    from(layout.buildDirectory.dir('generated/audit'))

    filesMatching('META-INF/mods.toml') {
        expand properties
    }
}

tasks.register('generateBookTranslationIndex', Exec) {
    def output = layout.buildDirectory.file(
        'generated/audit/assets/liminal_industries_ru/book-translations.json'
    )

    inputs.file translationManifestFile
    inputs.dir translationResourcePack
    inputs.dir compatibilityResourcePack
    inputs.file '../scripts/build_book_translation_index.py'
    inputs.file '../scripts/translation_sources.py'
    outputs.file output

    commandLine(
        'python3',
        '../scripts/build_book_translation_index.py',
        '--manifest',
        translationManifestFile.absolutePath,
        '--resourcepack',
        translationResourcePack.asFile.absolutePath,
        '--compatibility-resourcepack',
        compatibilityResourcePack.asFile.absolutePath,
        '--output',
        output.get().asFile.absolutePath
    )
}

tasks.register('generateTranslationAuditIndex') {
    inputs.file translationManifestFile
    inputs.file translationCatalogFile
    inputs.file runtimeAuditOverridesFile
    inputs.files compatibilityEnglishResources
    def output = layout.buildDirectory.file(
        'generated/audit/translation-audit-index.json'
    )
    outputs.file output
    doLast {
        def manifest = new JsonSlurper().parse(translationManifestFile)
        def catalog = new JsonSlurper().parse(translationCatalogFile)
        def runtimePolicy = new JsonSlurper().parse(runtimeAuditOverridesFile)
        if (!(runtimePolicy.schema in [1, 2])) {
            throw new GradleException(
                "Invalid runtime audit overrides: ${runtimeAuditOverridesFile}"
            )
        }
        def acceptedSameAsEnglish = new TreeMap(
            runtimePolicy.accepted_same_as_english ?: [:]
        )
        manifest.records.findAll {
            it.translation_key && it.source instanceof String
        }.each { record ->
            def matches = (catalog.entries[record.id] ?: []).findAll {
                it.source == record.source
                    && it.source_hash == record.source_hash
            }
            if (matches.size() > 1) {
                throw new GradleException(
                    "Duplicate catalog variants for ${record.id}"
                )
            }
            if (matches.size() == 1
                && matches[0].translation == record.source) {
                def previous = acceptedSameAsEnglish.putIfAbsent(
                    record.translation_key,
                    record.source
                )
                if (previous && previous != record.source) {
                    throw new GradleException(
                        "Conflicting accepted English source for "
                            + record.translation_key
                    )
                }
            }
        }
        def languageRecords = manifest.records.findAll {
            it.source_id == 'patchouli' && it.output_format == 'lang'
        }.collect {
            [
                id: it.id,
                translation_key: it.translation_key,
                source: it.source
            ]
        }
        def patchouliBooks = manifest.records.findAll {
            it.source_id == 'patchouli'
        }.collect {
            if (it.location.book) {
                return "${it.namespace}:${it.location.book}"
            }
            def matcher = it.location.member =~
                'assets/[^/]+/patchouli_books/([^/]+)/'
            if (!matcher.find()) {
                throw new GradleException(
                    "Could not identify Patchouli book for ${it.id}"
                )
            }
            "${it.namespace}:${matcher.group(1)}"
        }.unique().sort()
        def mantleBooks = manifest.records.findAll {
            it.source_id == 'tconstruct_books'
        }.collect {
            "${it.namespace}:${it.location.book}"
        }.unique().sort()
        def manualBooks = manifest.records.any {
            it.source_id == 'immersive_engineering_manual'
        } ? ['immersiveengineering:manual'] : []
        def languageTargetsByKey = [:]
        manifest.records.findAll {
            it.translation_key && it.source instanceof String
        }.each { record ->
            def target = [
                translation_key: record.translation_key,
                source: record.source,
                tier: record.tier ?: 'required',
                verification: record.kind in ['item_name', 'block_name']
                    ? 'runtime_provider'
                    : 'direct'
            ]
            def previous = languageTargetsByKey.putIfAbsent(
                record.translation_key,
                target
            )
            if (previous && previous.source != target.source) {
                previous.source = null
            }
            if (previous && target.tier == 'required') {
                previous.tier = 'required'
            }
            if (previous && target.verification == 'direct') {
                previous.verification = 'direct'
            }
        }
        def compatibilityEnglishByKey = [:]
        compatibilityEnglishResources.files.sort { it.path }.each { resource ->
            def document = new JsonSlurper().parse(resource)
            if (!(document instanceof Map)
                || document.any { key, value ->
                    !(key instanceof String) || !(value instanceof String)
                }) {
                throw new GradleException(
                    "Invalid compatibility language resource: ${resource}"
                )
            }
            document.each { key, source ->
                def previous = compatibilityEnglishByKey.putIfAbsent(key, source)
                if (previous != null && previous != source) {
                    throw new GradleException(
                        "Conflicting compatibility English source for ${key}"
                    )
                }
            }
        }
        compatibilityEnglishByKey.each { key, source ->
            def target = languageTargetsByKey[key]
            if (target != null) {
                target.source = source
            }
        }
        def languageTargets = languageTargetsByKey.values().sort {
            it.translation_key
        }
        def registryTargets = manifest.records.findAll {
            it.kind in ['item_name', 'block_name']
        }.collect { record ->
            record.kind == 'item_name'
                ? [registry_type: 'item', registry_id: record.item_id]
                : [registry_type: 'block', registry_id: record.block_id]
        }.unique().sort { left, right ->
            "${left.registry_type}\u0000${left.registry_id}" <=>
                "${right.registry_type}\u0000${right.registry_id}"
        }
        def targetNamespaces = manifest.records.collect { record ->
            record.namespace
        }.findAll().unique().sort()
        def screenRecords = manifest.records.findAll {
            it.source_id in [
                'patchouli',
                'tconstruct_books',
                'immersive_engineering_manual'
            ]
                && !(it.source_id == 'immersive_engineering_manual'
                    && it.output_format == 'lang')
        }.collect { record ->
            def location = record.location ?: [:]
            def member = location.output_member ?: location.member ?: ''
            def engine = [
                patchouli: 'patchouli',
                tconstruct_books: 'mantle',
                immersive_engineering_manual: 'immersive_engineering'
            ][record.source_id]
            def book = location.book
            if (!book && record.source_id == 'patchouli') {
                def matcher = member =~ 'patchouli_books/([^/]+)/'
                book = matcher.find() ? matcher.group(1) : null
            }
            if (!book && record.source_id == 'immersive_engineering_manual') {
                book = 'manual'
            }
            def entry = '<landing>'
            def entryMatcher = member =~ '/(?:entries|categories)/(.+)\\.(?:json|txt)$'
            if (entryMatcher.find()) {
                entry = entryMatcher.group(1)
            } else if (record.source_id != 'patchouli') {
                def filenameMatcher = member =~ '/([^/]+)\\.(?:json|txt)$'
                entry = filenameMatcher.find() ? filenameMatcher.group(1) : '<index>'
            }
            def page = null
            def pageMatcher = (location.pointer ?: '') =~ '^/pages/(\\d+)'
            if (pageMatcher.find()) {
                page = pageMatcher.group(1) as Integer
            } else if (location.line != null) {
                page = location.line
            }
            [
                engine: engine,
                book: "${record.namespace}:${book}",
                resource: member,
                entry: entry,
                page: page,
                text_source: record.translation_key
                    ? [type: 'translation_key', value: record.translation_key]
                    : location.pointer
                        ? [type: 'json_pointer', value: location.pointer]
                        : [type: 'line', value: String.valueOf(location.line)],
                source: record.source
            ]
        }.unique { record ->
            [
                record.engine,
                record.book,
                record.resource,
                record.entry,
                record.page,
                record.text_source
            ]
        }.sort { left, right ->
            def leftKey = [
                left.engine,
                left.book,
                left.resource,
                left.entry,
                left.page ?: -1,
                left.text_source.value
            ].join('\u0000')
            def rightKey = [
                right.engine,
                right.book,
                right.resource,
                right.entry,
                right.page ?: -1,
                right.text_source.value
            ].join('\u0000')
            leftKey <=> rightKey
        }
        def document = [
            schema: 4,
            version: selectedTranslationVersion,
            language_targets: languageTargets,
            accepted_same_as_english: acceptedSameAsEnglish,
            registry_targets: registryTargets,
            target_namespaces: targetNamespaces,
            book_screens: screenRecords,
            sources: [
                patchouli: [
                    language_records: languageRecords,
                    books: patchouliBooks
                ],
                tconstruct_books: [
                    books: mantleBooks
                ],
                immersive_engineering_manual: [
                    books: manualBooks
                ]
            ]
        ]
        def target = output.get().asFile
        target.parentFile.mkdirs()
        target.text = JsonOutput.prettyPrint(JsonOutput.toJson(document)) + '\n'
    }
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

tasks.register('runLayoutAuditClient') {
    group = 'verification'
    description = 'Runs the automated book layout audit client.'
    dependsOn 'runClient'
    doLast {
        def report = layout.projectDirectory.file(
            'run-layout-audit/liminal-industries-ru-audit/book-layout-audit.json'
        ).asFile
        if (!report.isFile()) {
            throw new GradleException("Layout audit did not create ${report}")
        }
        def result = new JsonSlurper().parse(report)
        if (result.result != 'PASS') {
            throw new GradleException(
                "Book layout audit failed with ${result.blocking_errors} errors"
            )
        }
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
            'Specification-Title': mod_id,
            'Specification-Vendor': 'Petr K.',
            'Specification-Version': '1',
            'Implementation-Title': project.name,
            'Implementation-Version': archiveVersion,
            'Implementation-Vendor': 'Petr K.'
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.deprecation = true
}
