import groovy.json.JsonSlurper
import groovy.json.JsonOutput

plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.36,6.2)'
}

def selectedTranslationVersion = providers.gradleProperty('translationVersion')
    .getOrElse(translation_version)
if (!(selectedTranslationVersion ==~ /[a-zA-Z0-9._-]+/)) {
    throw new GradleException("Invalid translationVersion: ${selectedTranslationVersion}")
}
def translationConfigFile = layout.projectDirectory.file(
    "../translation-versions/${selectedTranslationVersion}/build-config.json"
).asFile
def translationSourcesFile = layout.projectDirectory.file(
    "../translation-versions/${selectedTranslationVersion}/sources.json"
).asFile
def translationManifestFile = layout.projectDirectory.file(
    "../translation-versions/${selectedTranslationVersion}/manifest.json"
).asFile
if (!translationConfigFile.isFile()) {
    throw new GradleException(
        "Unknown translationVersion '${selectedTranslationVersion}': "
            + "${translationConfigFile} does not exist"
    )
}
def translationConfig = new JsonSlurper().parse(translationConfigFile)
if (translationConfig.schema != 1 || translationConfig.version != selectedTranslationVersion) {
    throw new GradleException("Invalid translation build config: ${translationConfigFile}")
}

version = translationConfig.version
group = mod_group_id

base {
    archivesName = 'liminal-industries-russian-translation-audit'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {
    mappings channel: 'official', version: minecraft_version
}

repositories {
    maven {
        name = 'Jared'
        url = 'https://maven.blamejared.com/'
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    compileOnly fg.deobf("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}")
    compileOnly fg.deobf("mezz.jei:jei-${minecraft_version}-forge-api:${jei_version}")

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

tasks.named('processResources', ProcessResources).configure {
    def properties = [
        minecraft_version: minecraft_version,
        forge_version: forge_version,
        jei_version: jei_version,
        mod_id: mod_id,
        mod_version: translationConfig.version
    ]
    inputs.properties properties
    inputs.file translationSourcesFile
    dependsOn 'generateTranslationAuditIndex'

    from(translationSourcesFile) {
        rename { 'translation-sources.json' }
    }
    from(layout.buildDirectory.dir('generated/audit'))

    filesMatching('META-INF/mods.toml') {
        expand properties
    }
}

tasks.register('generateTranslationAuditIndex') {
    inputs.file translationManifestFile
    def output = layout.buildDirectory.file(
        'generated/audit/translation-audit-index.json'
    )
    outputs.file output
    doLast {
        def manifest = new JsonSlurper().parse(translationManifestFile)
        def records = manifest.records.findAll {
            it.source_id == 'patchouli' && it.output_format == 'lang'
        }.collect {
            [
                id: it.id,
                translation_key: it.translation_key,
                source: it.source
            ]
        }
        def document = [
            schema: 1,
            version: selectedTranslationVersion,
            sources: [
                patchouli: records
            ]
        ]
        def target = output.get().asFile
        target.parentFile.mkdirs()
        target.text = JsonOutput.prettyPrint(JsonOutput.toJson(document)) + '\n'
    }
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
            'Specification-Title': mod_id,
            'Specification-Vendor': 'Petr K.',
            'Specification-Version': '1',
            'Implementation-Title': project.name,
            'Implementation-Version': archiveVersion,
            'Implementation-Vendor': 'Petr K.'
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.deprecation = true
}
