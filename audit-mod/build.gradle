import groovy.json.JsonSlurper
import groovy.json.JsonOutput

plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.36,6.2)'
}

def selectedTranslationVersion = providers.gradleProperty('translationVersion')
    .getOrElse(translation_version)
if (!(selectedTranslationVersion ==~ /[a-zA-Z0-9._-]+/)) {
    throw new GradleException("Invalid translationVersion: ${selectedTranslationVersion}")
}
def translationConfigFile = layout.projectDirectory.file(
    "../translation-versions/${selectedTranslationVersion}/build-config.json"
).asFile
def translationSourcesFile = layout.projectDirectory.file(
    "../translation-versions/${selectedTranslationVersion}/sources.json"
).asFile
def translationManifestFile = layout.projectDirectory.file(
    "../translation-versions/${selectedTranslationVersion}/manifest.json"
).asFile
if (!translationConfigFile.isFile()) {
    throw new GradleException(
        "Unknown translationVersion '${selectedTranslationVersion}': "
            + "${translationConfigFile} does not exist"
    )
}
def translationConfig = new JsonSlurper().parse(translationConfigFile)
if (translationConfig.schema != 1 || translationConfig.version != selectedTranslationVersion) {
    throw new GradleException("Invalid translation build config: ${translationConfigFile}")
}

version = translationConfig.version
group = mod_group_id

base {
    archivesName = 'liminal-industries-russian-translation-audit'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {
    mappings channel: 'official', version: minecraft_version

    runs {
        client {
            workingDirectory project.file('run-layout-audit')
            property 'forge.logging.console.level', 'info'
            property 'liminal.layoutAudit.auto', 'true'
            property 'liminal.layoutAudit.exitWhenDone', 'true'
            args '--quickPlaySingleplayer', 'Liminal Layout Audit'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
    }
}

repositories {
    maven {
        name = 'Jared'
        url = 'https://maven.blamejared.com/'
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    compileOnly fg.deobf("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}")
    compileOnly fg.deobf("mezz.jei:jei-${minecraft_version}-forge-api:${jei_version}")
    compileOnly fg.deobf(
        "vazkii.patchouli:Patchouli:${minecraft_version}-${patchouli_version}-FORGE"
    )
    runtimeOnly fg.deobf("mezz.jei:jei-${minecraft_version}-forge:${jei_version}")
    runtimeOnly fg.deobf(
        "vazkii.patchouli:Patchouli:${minecraft_version}-${patchouli_version}-FORGE"
    )

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

tasks.named('processResources', ProcessResources).configure {
    def properties = [
        minecraft_version: minecraft_version,
        forge_version: forge_version,
        jei_version: jei_version,
        patchouli_version: patchouli_version,
        mod_id: mod_id,
        mod_version: translationConfig.version
    ]
    inputs.properties properties
    inputs.file translationSourcesFile
    dependsOn 'generateTranslationAuditIndex'

    from(translationSourcesFile) {
        rename { 'translation-sources.json' }
    }
    from(layout.buildDirectory.dir('generated/audit'))

    filesMatching('META-INF/mods.toml') {
        expand properties
    }
}

tasks.register('generateTranslationAuditIndex') {
    inputs.file translationManifestFile
    def output = layout.buildDirectory.file(
        'generated/audit/translation-audit-index.json'
    )
    outputs.file output
    doLast {
        def manifest = new JsonSlurper().parse(translationManifestFile)
        def languageRecords = manifest.records.findAll {
            it.source_id == 'patchouli' && it.output_format == 'lang'
        }.collect {
            [
                id: it.id,
                translation_key: it.translation_key,
                source: it.source
            ]
        }
        def patchouliBooks = manifest.records.findAll {
            it.source_id == 'patchouli'
        }.collect {
            if (it.location.book) {
                return "${it.namespace}:${it.location.book}"
            }
            def matcher = it.location.member =~
                'assets/[^/]+/patchouli_books/([^/]+)/'
            if (!matcher.find()) {
                throw new GradleException(
                    "Could not identify Patchouli book for ${it.id}"
                )
            }
            "${it.namespace}:${matcher.group(1)}"
        }.unique().sort()
        def mantleBooks = manifest.records.findAll {
            it.source_id == 'tconstruct_books'
        }.collect {
            "${it.namespace}:${it.location.book}"
        }.unique().sort()
        def manualBooks = manifest.records.any {
            it.source_id == 'immersive_engineering_manual'
        } ? ['immersiveengineering:manual'] : []
        def screenRecords = manifest.records.findAll {
            it.source_id in [
                'patchouli',
                'tconstruct_books',
                'immersive_engineering_manual'
            ]
        }.collect { record ->
            def location = record.location ?: [:]
            def member = location.output_member ?: location.member ?: ''
            def engine = [
                patchouli: 'patchouli',
                tconstruct_books: 'mantle',
                immersive_engineering_manual: 'immersive_engineering'
            ][record.source_id]
            def book = location.book
            if (!book && record.source_id == 'patchouli') {
                def matcher = member =~ 'patchouli_books/([^/]+)/'
                book = matcher.find() ? matcher.group(1) : null
            }
            if (!book && record.source_id == 'immersive_engineering_manual') {
                book = 'manual'
            }
            def entry = '<landing>'
            def entryMatcher = member =~ '/(?:entries|categories)/(.+)\\.(?:json|txt)$'
            if (entryMatcher.find()) {
                entry = entryMatcher.group(1)
            } else if (record.source_id != 'patchouli') {
                def filenameMatcher = member =~ '/([^/]+)\\.(?:json|txt)$'
                entry = filenameMatcher.find() ? filenameMatcher.group(1) : '<index>'
            }
            def page = null
            def pageMatcher = (location.pointer ?: '') =~ '^/pages/(\\d+)'
            if (pageMatcher.find()) {
                page = pageMatcher.group(1) as Integer
            } else if (location.line != null) {
                page = location.line
            }
            [
                engine: engine,
                book: "${record.namespace}:${book}",
                resource: member,
                entry: entry,
                page: page,
                text_source: record.translation_key
                    ? [type: 'translation_key', value: record.translation_key]
                    : location.pointer
                        ? [type: 'json_pointer', value: location.pointer]
                        : [type: 'line', value: String.valueOf(location.line)],
                source: record.source
            ]
        }.unique { record ->
            [
                record.engine,
                record.book,
                record.resource,
                record.entry,
                record.page,
                record.text_source
            ]
        }.sort { left, right ->
            def leftKey = [
                left.engine,
                left.book,
                left.resource,
                left.entry,
                left.page ?: -1,
                left.text_source.value
            ].join('\u0000')
            def rightKey = [
                right.engine,
                right.book,
                right.resource,
                right.entry,
                right.page ?: -1,
                right.text_source.value
            ].join('\u0000')
            leftKey <=> rightKey
        }
        def document = [
            schema: 3,
            version: selectedTranslationVersion,
            book_screens: screenRecords,
            sources: [
                patchouli: [
                    language_records: languageRecords,
                    books: patchouliBooks
                ],
                tconstruct_books: [
                    books: mantleBooks
                ],
                immersive_engineering_manual: [
                    books: manualBooks
                ]
            ]
        ]
        def target = output.get().asFile
        target.parentFile.mkdirs()
        target.text = JsonOutput.prettyPrint(JsonOutput.toJson(document)) + '\n'
    }
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

tasks.register('runLayoutAuditClient') {
    group = 'verification'
    description = 'Runs the automated book layout audit client.'
    dependsOn 'runClient'
    doLast {
        def report = layout.projectDirectory.file(
            'run-layout-audit/liminal-industries-ru-audit/book-layout-audit.json'
        ).asFile
        if (!report.isFile()) {
            throw new GradleException("Layout audit did not create ${report}")
        }
        def result = new JsonSlurper().parse(report)
        if (result.result != 'PASS') {
            throw new GradleException(
                "Book layout audit failed with ${result.translation_errors} errors"
            )
        }
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
            'Specification-Title': mod_id,
            'Specification-Vendor': 'Petr K.',
            'Specification-Version': '1',
            'Implementation-Title': project.name,
            'Implementation-Version': archiveVersion,
            'Implementation-Vendor': 'Petr K.'
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.deprecation = true
}
