import groovy.json.JsonSlurper

plugins {
    id 'net.minecraftforge.gradle' version '[6.0.36,6.2)'
}

def selectedTranslationVersion = providers.gradleProperty('translationVersion')
    .getOrElse(translation_version)
if (!(selectedTranslationVersion ==~ /[a-zA-Z0-9._-]+/)) {
    throw new GradleException("Invalid translationVersion: ${selectedTranslationVersion}")
}

def translationVersionRoot = layout.projectDirectory.dir(
    "../translation-versions/${selectedTranslationVersion}"
)
def translationConfigFile = translationVersionRoot.file('build-config.json').asFile
if (!translationConfigFile.isFile()) {
    throw new GradleException(
        "Unknown translationVersion '${selectedTranslationVersion}': "
            + "${translationConfigFile} does not exist"
    )
}
def translationConfig = new JsonSlurper().parse(translationConfigFile)
if (translationConfig.schema != 1 || translationConfig.version != selectedTranslationVersion) {
    throw new GradleException("Invalid translation build config: ${translationConfigFile}")
}

def releaseIteration = providers.gradleProperty('releaseIteration').orNull
if (releaseIteration != null && !(releaseIteration ==~ /[1-9][0-9]*/)) {
    throw new GradleException("Invalid releaseIteration: ${releaseIteration}")
}
def releaseBaseVersion = translationConfig.version.replaceFirst(/-original$/, '')
def publishedVersion = releaseIteration == null
    ? translationConfig.version
    : "${releaseBaseVersion}-${releaseIteration}"

version = publishedVersion
group = mod_group_id

base {
    archivesName = 'liminal-industries-russian-translation'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

def translationSources = translationVersionRoot.dir('payload')
def translationResourcePack = translationSources.dir('resourcepack')
def translationQuests = translationSources.dir('quests')
def resourcePackManifest = translationVersionRoot.file('resource-packs.json')
def generatedTranslationResources = layout.buildDirectory.dir('generated/translationResources')
def resourcePackOutput = layout.buildDirectory.dir(
    "resourcepacks/${selectedTranslationVersion}"
)
def releaseOutput = layout.buildDirectory.dir(
    "releases/${selectedTranslationVersion}"
)

sourceSets.main.resources {
    srcDir translationResourcePack
    srcDir generatedTranslationResources
}

minecraft {
    mappings channel: 'official', version: minecraft_version

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${buildDir}/createSrgToMcp/output.srg"
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {}
        server {
            args '--nogui'
        }
    }
}

repositories {
    maven {
        name = 'FTB'
        url = 'https://maven.ftb.dev/releases'
    }
    maven {
        name = 'Architectury'
        url = 'https://maven.architectury.dev/'
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    implementation fg.deobf(
        "dev.ftb.mods:ftb-quests-forge:${translationConfig.ftb_quests_version}"
    )
    implementation fg.deobf('dev.ftb.mods:ftb-library-forge:2001.2.9')
    runtimeOnly fg.deobf('dev.ftb.mods:ftb-teams-forge:2001.3.0')
    runtimeOnly fg.deobf('dev.architectury:architectury-forge:9.1.12')

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

tasks.register('generateQuestTranslationIndex') {
    def questFiles = fileTree(translationQuests) {
        include '**/*.snbt'
    }
    def indexOutput = generatedTranslationResources.map {
        it.file('liminal_industries_ru/quest-files.list')
    }

    inputs.files questFiles
    outputs.file indexOutput

    doLast {
        def relativePaths = questFiles.files.collect { file ->
            translationQuests.asFile.toPath()
                .relativize(file.toPath())
                .toString()
                .replace(File.separator, '/')
        }.sort()
        def output = indexOutput.get().asFile
        output.parentFile.mkdirs()
        output.setText(relativePaths.join('\n') + '\n', 'UTF-8')
    }
}

tasks.register('buildResourcePacks', Exec) {
    group = 'build'
    description = 'Builds deterministic per-mod Russian resource-pack ZIPs.'

    inputs.file resourcePackManifest
    inputs.dir translationResourcePack
    inputs.file '../scripts/build_resource_packs.py'
    inputs.file '../assets/liminal-industries-russian-translation-256kb.png'
    outputs.dir resourcePackOutput

    commandLine(
        'python3',
        '../scripts/build_resource_packs.py',
        '--version',
        selectedTranslationVersion,
        '--output',
        resourcePackOutput.get().asFile.absolutePath
    )
}

tasks.register('verifyResourcePackPartition', Exec) {
    group = 'verification'
    description = 'Verifies exact resource partitioning and reproducible ZIP output.'
    dependsOn 'buildResourcePacks', 'jar'

    inputs.file resourcePackManifest
    inputs.dir translationResourcePack
    inputs.files tasks.named('buildResourcePacks')

    commandLine(
        'python3',
        '../scripts/build_resource_packs.py',
        '--version',
        selectedTranslationVersion,
        '--output',
        resourcePackOutput.get().asFile.absolutePath,
        '--check',
        '--jar',
        tasks.named('jar', Jar).get().archiveFile.get().asFile.absolutePath
    )
}

tasks.named('processResources', ProcessResources).configure {
    dependsOn 'generateQuestTranslationIndex'

    def properties = [
        minecraft_version: minecraft_version,
        forge_version: forge_version,
        mod_id: mod_id,
        mod_name: mod_name,
        mod_license: mod_license,
        mod_version: publishedVersion,
        mod_authors: mod_authors,
        mod_description: translationConfig.mod_description,
        ftb_quests_version_range: translationConfig.ftb_quests_version_range
    ]
    inputs.properties properties

    from(translationQuests) {
        into 'liminal_industries_ru/quests'
    }

    filesMatching('META-INF/mods.toml') {
        expand properties + [project: project]
    }
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
    systemProperty 'translation.payload', translationSources.asFile.absolutePath
    systemProperty(
        'translation.expectedQuestObjectIds',
        translationConfig.expected_quest_object_ids.toString()
    )
    systemProperty(
        'translation.expectedQuestTranslations',
        translationConfig.expected_quest_translations.toString()
    )
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
            'Specification-Title': mod_id,
            'Specification-Vendor': mod_authors,
            'Specification-Version': '1',
            'Implementation-Title': project.name,
            'Implementation-Version': archiveVersion,
            'Implementation-Vendor': mod_authors,
            'MixinConfigs': 'liminal_industries_ru.mixins.json'
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.named('build').configure {
    dependsOn 'verifyResourcePackPartition'
}

tasks.register('assembleTranslationRelease', Sync) {
    group = 'build'
    description = 'Collects the selected translation JAR and resource packs.'
    dependsOn 'build'

    into releaseOutput
    from(tasks.named('jar').flatMap { it.archiveFile })
    from(resourcePackOutput) {
        into 'resourcepacks'
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
